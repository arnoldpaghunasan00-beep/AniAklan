<!DOCTYPE html>
<html lang="fil">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ani.Aklan | Admin Dashboard</title>
    
    <link rel="icon" type="image/png" sizes="64x64" href="assets/images/logo/logo2.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,600&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --deep-green: #3B6D11;
            --harvest-green: #639922;
            --light-field: #EAF3DE;
            --amber: #FFBF00;
            --soil: #5D4037;
            --cream: #FCFDF9;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.8);
            --shadow: 0 20px 40px rgba(59, 109, 17, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { max-width: 100%; overflow-x: hidden; width: 100%; font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--cream); color: var(--soil); }

        nav { position: fixed; top: 0; width: 100%; padding: 0.8rem 5%; display: flex; justify-content: space-between; align-items: center; background: var(--glass); backdrop-filter: blur(15px); z-index: 1000; border-bottom: 1px solid rgba(99, 153, 34, 0.1); }
        .logo { display: flex; align-items: center; gap: 15px; flex: 1; }
        .logo img { height: 50px; width: auto; }
        .nav-menu { display: flex; gap: 2rem; list-style: none; flex: 2; justify-content: center; }
        .nav-menu a { text-decoration: none; color: var(--soil); font-weight: 600; }
        .auth-buttons { display: flex; align-items: center; gap: 10px; flex: 1; justify-content: flex-end; }
        .tab { padding: 0.8rem 2rem; border-radius: 50px; border: 2px solid var(--light-field); background: none; font-weight: 700; cursor: pointer; text-decoration: none; }
        .tab.active { background: var(--harvest-green); color: white; border-color: var(--harvest-green); }

        /* Admin Content */
        .admin-section { padding: 150px 10% 6rem; width: 100%; }
        .admin-header { margin-bottom: 3rem; }
        .admin-header h1 { font-family: 'Lora', serif; color: var(--deep-green); font-size: 3rem; }
        
        .admin-nav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; }
        .admin-btn { 
            background: var(--white); padding: 3rem 2rem; border-radius: 30px; 
            text-align: center; border: 1px solid rgba(59, 109, 17, 0.1); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); cursor: pointer; transition: 0.3s;
            text-decoration: none; color: var(--soil); font-weight: 700; font-size: 1.2rem;
            display: flex; flex-direction: column; align-items: center; gap: 1rem;
        }
        .admin-btn:hover { transform: translateY(-10px); box-shadow: var(--shadow); border-color: var(--harvest-green); color: var(--deep-green); }
        .admin-btn i { font-size: 3rem; color: var(--harvest-green); }

        /* Mobile FAB - Same as index.html */
        .mobile-fab-container { display: none; position: fixed; bottom: 30px; right: 30px; z-index: 3000; }
        .mobile-fab-btn { width: 60px; height: 60px; background: #3B6D11; color: white; border-radius: 50%; border: none; font-size: 1.5rem; cursor: pointer; }
        .mobile-menu-popup { display: none; flex-direction: column; background: white; padding: 24px 16px; border-radius: 32px; box-shadow: 0 12px 40px rgba(0,0,0,0.15); gap: 8px; min-width: 250px; position: absolute; bottom: 80px; right: 0; }
        .mobile-menu-popup.active { display: flex; }
        .popup-item { text-decoration: none; color: #5D4037; font-weight: 700; padding: 14px 20px; border-radius: 20px; display: flex; align-items: center; gap: 16px; }

        @media (max-width: 768px) {
            .mobile-fab-container { display: flex; flex-direction: column; align-items: flex-end; }
            .nav-menu { display: none; }
            .admin-section { padding: 100px 5% 4rem; }
            .admin-header h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">
            <img src="assets/images/logo/logo2.png" alt="Ani.Aklan Logo">
        </div>
        <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="tindahan.html">Tindahan</a></li>
            <li><a href="pagsasaka.html">Pagsasaka</a></li>
            <li><a href="ulat.html">Ulat</a></li>
            <li><a href="tulong.html">Tulong at Impormasyon</a></li>
            <li><a href="admin.html">Admin</a></li>
        </ul>
        <div class="auth-buttons">
            <a href="login.html" class="tab active">Log In</a>
        </div>
    </nav>

    <div class="mobile-fab-container">
        <div class="mobile-menu-popup" id="mobileMenu">
            <a href="index.html" class="popup-item"><i class="fa-solid fa-house"></i> Home</a>
            <a href="tindahan.html" class="popup-item"><i class="fa-solid fa-store"></i> Tindahan</a>
            <a href="admin.html" class="popup-item highlight"><i class="fa-solid fa-user-shield"></i> Admin</a>
        </div>
        <button class="mobile-fab-btn" onclick="document.getElementById('mobileMenu').classList.toggle('active')">
            <i class="fa-solid fa-bars"></i>
        </button>
    </div>

    <section class="admin-section">
        <div class="admin-header">
            <h1>Admin Dashboard</h1>
            <p>Piliin ang nais mong gawin:</p>
        </div>

        <div class="admin-nav-grid">
            <a href="listings.html" class="admin-btn">
                <i class="fa-solid fa-list-ul"></i>
                Mga Listing
            </a>
            <a href="reports.html" class="admin-btn">
                <i class="fa-solid fa-chart-bar"></i>
                Mga Report
            </a>
            <a href="delete-post.html" class="admin-btn">
                <i class="fa-solid fa-trash-can"></i>
                Tanggalin ang Post
            </a>
        </div>
    </section>

</body>
</html>
