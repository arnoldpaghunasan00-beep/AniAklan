<!DOCTYPE html>
<html lang="fil">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Ani.Aklan</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,600&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --deep-green: #3B6D11;
            --harvest-green: #639922;
            --light-field: #EAF3DE;
            --amber: #FFBF00;
            --soil: #5D4037;
            --cream: #FCFDF9;
            --white: #ffffff;
            --shadow: 0 20px 40px rgba(59, 109, 17, 0.15);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--cream);
            color: var(--soil);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .signup-card {
            background: var(--white);
            width: 100%;
            max-width: 500px;
            padding: 3rem 2.5rem;
            border-radius: 40px;
            box-shadow: var(--shadow);
            border: 1px solid var(--light-field);
            text-align: center;
        }

        .brand-logo {
            margin-bottom: 1.5rem;
        }

        .brand-logo img {
            height: 50px;
            width: auto;
        }

        h2 {
            font-family: 'Lora', serif;
            font-size: 2rem;
            color: var(--deep-green);
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 0.95rem;
            opacity: 0.8;
            margin-bottom: 2rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 0.6rem;
            font-size: 0.9rem;
            color: var(--deep-green);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--harvest-green);
        }

        input {
            width: 100%;
            padding: 1rem 1rem 1rem 45px;
            border: 2px solid var(--light-field);
            border-radius: 15px;
            font-family: inherit;
            font-size: 1rem;
            transition: 0.3s;
            outline: none;
        }

        input:focus {
            border-color: var(--harvest-green);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(99, 153, 34, 0.1);
        }

        .signup-btn {
            width: 100%;
            padding: 1.2rem;
            background: var(--harvest-green);
            color: white;
            border: none;
            border-radius: 15px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 1rem;
            box-shadow: 0 10px 20px rgba(99, 153, 34, 0.2);
        }

        .signup-btn:hover {
            background: var(--deep-green);
            transform: translateY(-2px);
        }

        .footer-links {
            margin-top: 2rem;
            font-size: 0.9rem;
        }

        .footer-links a {
            color: var(--harvest-green);
            text-decoration: none;
            font-weight: 700;
            transition: 0.2s;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 1.5rem;
            color: var(--soil);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            opacity: 0.7;
        }

        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            .signup-card {
                padding: 2.5rem 1.5rem;
                border-radius: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="signup-card">
        <div class="brand-logo">
            <img src="assets/images/logo/logo2.png" alt="Ani.Aklan">
            <img src="assets/images/logo/logo3.png" alt="Secondary Logo">
        </div>
        
        <h2>Sumali sa Ani.Aklan</h2>
        <p class="subtitle">Magrehistro upang magsimula ng iyong harvest journey.</p>

        <form action="#">
            <div class="form-group">
                <label>Buong Pangalan</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-address-card"></i>
                    <input type="text" placeholder="Ipasok ang buong pangalan" required>
                </div>
            </div>

            <div class="form-group">
                <label>Email o Mobile Number</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="text" placeholder="Ipasok ang iyong email o numero" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Gumawa ng password" required>
                </div>
            </div>

            <div class="form-group">
                <label>Kumpirmahin ang Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-shield-halved"></i>
                    <input type="password" placeholder="Ipasok muli ang password" required>
                </div>
            </div>

            <button type="submit" class="signup-btn">Mag-sign Up</button>
        </form>

        <div class="footer-links">
            Mayroon ka nang account? <a href="login.html">Mag-login dito</a>
        </div>

        <a href="index.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i> Balik sa Home
        </a>
    </div>

</body>
</html>
